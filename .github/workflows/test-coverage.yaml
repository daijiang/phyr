# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, gh-actions]
  pull_request:
    branches: [main, master]

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      _R_CHECK_LENGTH_1_LOGIC2_: FALSE
      # no dependency comes from Bioconductor; skipping its indexes avoids
      # intermittent 'Invalid line 1 in PACKAGES file' failures in pak
      PKG_USE_BIOCONDUCTOR: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: "https://inla.r-inla-download.org/R/stable"

      - uses: r-lib/actions/setup-r-dependencies@v2
        id: deps
        continue-on-error: true
        with:
          dependencies: '"all"'
          extra-packages: covr

      # retry once: repository metadata downloads fail intermittently
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.deps.outcome == 'failure'
        with:
          dependencies: '"all"'
          extra-packages: covr

      - name: Test coverage
        run: covr::lcov(covr::package_coverage())
        shell: Rscript {0}

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
